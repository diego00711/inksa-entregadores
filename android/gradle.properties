 Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Djava.net.preferIPv4Stack=true -Djava.io.tmpdir=C:/Temp -Djavax.net.ssl.trustStoreType=Windows-ROOT -Djavax.net.ssl.trustStore=NUL -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.daemon=false
android.useAndroidX=true
# Google Play exige API 36 (Android 16) até 30/08/2026. O AGP 8.7.2 foi testado
# até o compileSdk 35 — a flag silencia o aviso ao compilar contra o 36.
android.suppressUnsupportedCompileSdk=36
android.overridePathCheck=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true
